<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b"><title>Bravo AI — Private Chat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <section id="loginView" class="login-card">
    <div class="logo">✦</div><h1>Bravo AI</h1><p class="muted">A private, personal chat space</p>
    <div class="role-tabs"><button class="tab active" data-role="guest">Chat</button><button class="tab" data-role="admin">Admin</button></div>
    <form id="loginForm">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      <button class="primary" type="submit">Continue <span>→</span></button>
      <p id="loginError" class="error" aria-live="polite"></p>
    </form>
    <p class="tiny">Private chat. Replies are sent personally by the account owner, not generated by AI.</p>
  </section>
  <section id="chatView" class="chat hidden">
    <header><div class="avatar">✦</div><div class="headcopy"><strong>Bravo AI</strong><small><i class="online"></i> Private chat</small></div><button id="logout" class="icon-btn" aria-label="Log out">↪</button></header>
    <div class="notice">A personal chat with the account owner — messages are not AI-generated.</div>
    <main id="messages" class="messages"><div class="empty" id="empty">Start the conversation 👋</div></main>
    <form id="sendForm" class="composer"><input id="messageInput" maxlength="2000" placeholder="Message Bravo AI…" autocomplete="off" required><button aria-label="Send" class="send" type="submit">➤</button></form>
    <div id="sendError" class="send-error"></div>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
