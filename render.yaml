services:
  - type: web
    name: bravo-ai-private-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHAT_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
